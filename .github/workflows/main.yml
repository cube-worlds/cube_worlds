name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm --prefix src/frontend ci
      - run: npm run lint
      - run: npm run typecheck
      # typecheck is `tsc` with noEmit, so it never exercises the emit that
      # `build:bot` actually ships, and the landing build was not run at all.
      # build:all covers both plus the frontend build this step used to do.
      - run: npm run build:all

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:backend

  # Boots the real app (STAGING, fake secrets, throwaway Mongo) and drives the
  # API end-to-end — catches wiring/serialization breaks unit tests can't see.
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run smoke:api
