# Staging bot — `kamal deploy -d staging`.
#
# A real second instance of the CURRENT tree: Telegram bot @cubeworldsbot
# (webhook), its own mongo DB + data volume, own host. Everything else (chain
# keys, Pinata, Stability, OpenAI, admins) is inherited from the base config
# and .kamal/secrets-common, so an admin ✅ Approve on staging mints a REAL
# item into the live collection with the live MNEMONICS wallet — don't
# approve throwaway submissions.
#
# Different `service` ⇒ different container labels, so the pre-app-boot
# stop-old-first hook only fences staging containers, never prod.
service: cube-worlds-bot-staging
proxy:
  hosts:
    - staging.cubeworlds.club
volumes:
  - "/srv/cube_worlds_staging/data:/usr/src/data"
env:
  clear:
    BOT_NAME: cubeworldsbot
    WEB_APP_URL: https://staging.cubeworlds.club
  # MONGO / BOT_TOKEN / BOT_WEBHOOK / BOT_WEBHOOK_SECRET come from
  # .kamal/secrets.staging (overrides secrets-common).
